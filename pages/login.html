<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Клубешник</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Главная</a>
            <a href="contacts.html">Контакты</a>
            <a href="booking.html">Бронь</a>
            <a href="account.html">Личный кабинет</a>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h1>Вход в аккаунт</h1>
            <form>
                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
            <a href="register.html" class="auth-link">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </main>

    <footer>
        <p>(C) Клубешник, 2026. Все права защищены</p>
        <p>Ищем поставщиков продукции! Напишите сюда: admin@clubeshnik.ru</p>
    </footer>
    <script src="../js/login.js"></script>
</body>
</html>
